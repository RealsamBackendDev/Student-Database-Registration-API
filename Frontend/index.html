<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student database registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>REAL SAMUEL UNIVERSITY OF NIGERIA</h1>
        <h2>STUDENT DATABASE REGISTRATION PORTAL</h2>
    </header>
    <main>
        <section class="left-side">
            <h3>Create your Student Account here</h3>
            <form id="studentForm">
                <fieldset>
                    <legend>Personal Details</legend>
                    <label for="name">Full name:</label> 
                  
                    <input type="text" name="name" id="name" autocomplete="off" placeholder="Full name" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" autocomplete="off" placeholder="example@example.com" required>
                    
                    <label for="Age">Age:</label>
                    <input type="number" name="age" id="age" min="1" max="100" placeholder="Enter your age">

                    <label for="course">Course of study:</label>
                    <input type="text" name="course" id="course" placeholder="Your course of study">

                    <label for="Level">Level:</label>
                    <select name="Level" id="Level">
                        <option value="">--Select Level--</option>
                        <option value="100L">100L</option>
                        <option value="200L">200L</option>
                        <option value="300L">300L</option>
                        <option value="400L">400L</option>
                        <option value="500L">500L</option>
                    </select>
                    <button id="createBtn" type="submit">Create Account</button>
                </fieldset> 
            </form>
            
            <ul id="studentDetails"></ul>
        </section>
       
        <section class="right-side">
            <form id="searchForm">
                <fieldset>
                    <legend>Or</legend>
                    <h3>Search your Account here</h3>
                    <input type="text" id="SearchInput" placeholder="Search Your details">
                    <button id="seachBtn" type="submit">Search</button>
                </fieldset>
            </form>
          
            <ul id="searchResult"></ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
